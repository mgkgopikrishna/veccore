apiVersion: apps/v1
kind: Deployment
metadata:
  name: veccore
  namespace: platform
  labels: { app.kubernetes.io/name: veccore }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: veccore }
  template:
    metadata:
      labels: { app.kubernetes.io/name: veccore }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: veccore
          image: ghcr.io/mgkgopikrishna/veccore:0.1.0
          ports:
            - { name: http, containerPort: 8000 }
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits:   { cpu: "1",  memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 20
            periodSeconds: 20
      volumes:
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: veccore
  namespace: platform
spec:
  selector: { app.kubernetes.io/name: veccore }
  ports:
    - { name: http, port: 80, targetPort: http }
